<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Mon Bracket Beats</title>
<style>
  :root{
    --bg:#0d0f14; --card:#171a22; --card2:#1f2330; --line:#2a2f3d;
    --txt:#f1f3f8; --mut:#9aa3b5; --acc:#1ed760; --acc2:#8b5cf6; --red:#ff5d6c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
  #app{max-width:900px;margin:0 auto;padding:16px}
  h1{font-size:26px;margin:8px 0 4px;letter-spacing:-.5px}
  h2{font-size:19px;margin:22px 0 10px}
  p{line-height:1.45}
  .mut{color:var(--mut)} .small{font-size:13px}
  .logo{font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;background:var(--card2);color:var(--txt);text-decoration:none}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.pri{background:var(--acc);color:#05200f}
  .btn.vio{background:var(--acc2);color:#fff}
  .btn.ghost{background:transparent;border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--red);border:1px solid #4a2530}
  .btn.full{width:100%}
  .btn.sm{padding:8px 12px;font-size:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  input[type=text]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0f1218;color:var(--txt);font-size:16px}
  code.box{display:block;padding:10px;border-radius:10px;background:#0f1218;border:1px dashed var(--line);word-break:break-all;font-size:13px;margin:8px 0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--txt);font-weight:700;cursor:pointer;font-size:14px}
  .chip.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
  .chip:disabled{opacity:.3}
  .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .meta{flex:1;min-width:0}
  .row .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .a{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cov{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:linear-gradient(135deg,var(--acc2),var(--acc));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
  .x{background:transparent;border:0;color:var(--mut);font-size:20px;padding:6px 8px;cursor:pointer}
  .poolList{max-height:320px;overflow:auto}
  .resume{border-color:var(--acc2);background:linear-gradient(135deg,#1f1838,#171a22)}
  /* Duel */
  .rhead{text-align:center;margin:6px 0 10px}
  .rhead .r{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc)}
  .rhead .m{font-size:22px;font-weight:800}
  .bar{height:6px;background:var(--card2);border-radius:9px;overflow:hidden;margin:8px 0 14px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
  .duel{display:grid;gap:8px}
  @media(min-width:720px){.duel{grid-template-columns:1fr auto 1fr;align-items:stretch}}
  .side{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
  .side .head{display:flex;gap:12px;align-items:center}
  .side .head .cov{width:64px;height:64px;font-size:24px}
  .side .t{font-size:17px;font-weight:800;line-height:1.2}
  .side .a{color:var(--mut);font-size:14px;margin-top:2px}
  .vs{align-self:center;justify-self:center;font-weight:900;color:var(--mut);font-size:15px;padding:2px}
  iframe.emb{width:100%;border:0;border-radius:12px;background:#000}
  .noemb{height:80px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px}
  .actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
  /* Results */
  .win{text-align:center}
  .win img,.win .cov{width:180px;height:180px;border-radius:18px;margin:8px auto;font-size:60px;box-shadow:0 10px 40px rgba(30,215,96,.25)}
  .win .t{font-size:24px;font-weight:900}
  .place{font-weight:800;color:var(--acc);width:52px;flex:none;font-size:14px}
  /* Bracket view */
  .modal{position:fixed;inset:0;background:rgba(5,6,10,.96);z-index:20;display:flex;flex-direction:column}
  .modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
  .bwrap{flex:1;overflow:auto;padding:16px}
  .cols{display:flex;gap:14px;min-width:max-content}
  .col{display:flex;flex-direction:column;justify-content:space-around;gap:10px;width:170px}
  .col h4{margin:0 0 4px;font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:1px}
  .mt{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12px}
  .mt div{padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
  .mt div+div{border-top:1px solid var(--line)}
  .mt div.w{color:var(--txt);font-weight:800;background:#1b2a22}
  .mt div.cur{outline:1px solid var(--acc2)}
  /* misc */
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:50;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .busy{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:600}
  .spin{width:38px;height:38px;border:4px solid #333;border-top-color:var(--acc);border-radius:50%;animation:s 0.8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0f1218;color:var(--txt);font-size:15px;font-family:inherit;resize:vertical}
  select{padding:9px 10px;border-radius:10px;background:#0f1218;color:var(--txt);border:1px solid var(--line);font-size:14px}
  ol.steps{padding-left:20px;line-height:1.5} ol.steps li{margin:6px 0}
  a{color:var(--acc)}
  /* Versus */
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin:6px 0 14px}
  .tabs button{border:0;border-radius:999px;padding:11px;font-weight:800;font-size:14px;background:transparent;color:var(--mut);cursor:pointer}
  .tabs button.on{background:var(--txt);color:var(--bg)}
  .av{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:linear-gradient(135deg,var(--acc2),var(--acc));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:22px}
  .win .av.big{width:140px;height:140px;border-radius:50%;font-size:52px;margin:10px auto}
  .score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin:8px 0 12px}
  .score .p{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
  .score .p .n{font-weight:800;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .score .s{font-size:34px;font-weight:900;letter-spacing:2px}
  .tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.5px;text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag.a{background:rgba(30,215,96,.15);color:var(--acc)} .tag.b{background:rgba(139,92,246,.2);color:#b9a0ff}
  .side.a{border-color:rgba(30,215,96,.4)} .side.b{border-color:rgba(139,92,246,.5)}
  .btn.vio.full{width:100%}
  .mine{font-size:11px}
  .rd{display:grid;grid-template-columns:30px 1fr 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .rd:last-child{border-bottom:0}
  .rd div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rd .w{font-weight:800;color:var(--txt)} .rd .l{color:var(--mut)}
  .rd .n{color:var(--acc);font-weight:800}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ========= Config ========= */
const API = "https://api.spotify.com/v1";
const AUTH_URL = "https://accounts.spotify.com/authorize";
const TOKEN_URL = "https://accounts.spotify.com/api/token";
const REDIRECT_URI = location.origin + location.pathname.replace(/index\.html$/, "");
const SCOPES = [
  "user-top-read","user-library-read","playlist-read-private",
  "playlist-read-collaborative","playlist-modify-private","playlist-modify-public"
].join(" ");
const SIZES = [4, 8, 16, 32, 64];
const ROUND_NAMES = {2:"Finale",4:"Demi-finales",8:"Quarts de finale",16:"Huitièmes de finale",32:"Seizièmes de finale",64:"32es de finale"};

/* ========= Storage ========= */
const LS = {
  get(k, d=null){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ========= State ========= */
const S = {
  view: "home",
  clientId: LS.get("bb_client_id", ""),
  token: LS.get("bb_token", null),
  me: LS.get("bb_me", null),
  demo: LS.get("bb_demo", false),
  pool: LS.get("bb_pool", []),
  bracket: LS.get("bb_bracket", null),
  size: LS.get("bb_size", 16),
  order: LS.get("bb_order", "random"),
  topRange: "medium_term",
  playlists: null,
  search: { q: "", results: [], offset: 0 },
  showBracket: false,
  savedUrl: null,
  busy: null,
  mode: LS.get("bb_mode", "bracket"),
  lib: LS.get("bb_lib", null),
  vs: LS.get("bb_vs_setup", null) || { a:null, b:null, candA:[], candB:[], n:5, src:"mix", order:"ordered" },
  versus: LS.get("bb_versus", null),
  artistPick: { side:0, q:"", results:[] },
  vsOpen: { 0:false, 1:false },
  guest: LS.get("bb_guest", false)
};
const savePool = () => LS.set("bb_pool", S.pool);
const saveBracket = () => S.bracket ? LS.set("bb_bracket", S.bracket) : LS.del("bb_bracket");

/* ========= Utils ========= */
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function randStr(n){ const c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"; const a=new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => c[b % c.length]).join(""); }
async function sha256b64url(s){
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
let toastTimer;
function toast(msg, ms=3200){
  document.querySelectorAll(".toast").forEach(e => e.remove());
  const d = document.createElement("div"); d.className = "toast"; d.textContent = msg;
  document.body.appendChild(d); clearTimeout(toastTimer); toastTimer = setTimeout(() => d.remove(), ms);
}
function setBusy(msg){ S.busy = msg; render(); }
function cover(t, cls="cov"){
  return t.img ? `<img class="${cls}" src="${esc(t.img)}" alt="" loading="lazy">`
               : `<div class="${cls}">${esc((t.name||"?").trim().charAt(0).toUpperCase())}</div>`;
}
function embed(t, h=80){
  if (t.demo || !t.id) return `<div class="noemb">Lecteur Spotify (désactivé en démo)</div>`;
  return `<iframe class="emb" height="${h}" src="https://open.spotify.com/embed/track/${encodeURIComponent(t.id)}?theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
}
function normTrack(t){
  if (!t || t.is_local || !t.id || (t.type && t.type !== "track")) return null;
  const imgs = (t.album && t.album.images) || [];
  return {
    id: t.id, uri: t.uri || ("spotify:track:" + t.id), name: t.name,
    artists: (t.artists || []).map(a => a.name).join(", "),
    arts: (t.artists || []).map(a => ({ id: a.id, name: a.name })),
    img: (imgs[1] || imgs[0] || {}).url || "",
    big: (imgs[0] || {}).url || ""
  };
}
function addToPool(tracks){
  const have = new Set(S.pool.map(t => t.id)); let added = 0, dup = 0;
  for (const t of tracks){ if (!t) continue; if (have.has(t.id)){ dup++; continue; } have.add(t.id); S.pool.push(t); added++; }
  savePool();
  toast(`+${added} son${added>1?"s":""} ajouté${added>1?"s":""}` + (dup ? ` (${dup} déjà dans le pool)` : ""));
}

/* ========= Auth (PKCE) ========= */
async function login(){
  const verifier = randStr(64), state = randStr(16);
  LS.set("bb_verifier", verifier); LS.set("bb_oauth_state", state);
  const p = new URLSearchParams({
    client_id: S.clientId, response_type: "code", redirect_uri: REDIRECT_URI, scope: SCOPES,
    code_challenge_method: "S256", code_challenge: await sha256b64url(verifier), state
  });
  location.href = AUTH_URL + "?" + p.toString();
}
async function handleCallback(q){
  history.replaceState(null, "", REDIRECT_URI);
  if (q.get("error")){ toast("Connexion annulée ou refusée : " + q.get("error"), 5000); return; }
  if (q.get("state") !== LS.get("bb_oauth_state")){ toast("Erreur de sécurité à la connexion, réessaie."); return; }
  const body = new URLSearchParams({
    grant_type: "authorization_code", code: q.get("code"), redirect_uri: REDIRECT_URI,
    client_id: S.clientId, code_verifier: LS.get("bb_verifier", "")
  });
  const r = await fetch(TOKEN_URL, { method: "POST", headers: {"Content-Type":"application/x-www-form-urlencoded"}, body });
  const j = await r.json().catch(() => ({}));
  if (!r.ok){ toast("Connexion impossible : " + (j.error_description || j.error || r.status), 6000); return; }
  setToken(j); LS.del("bb_verifier"); LS.del("bb_oauth_state");
}
function setToken(j){
  S.token = { access_token: j.access_token, refresh_token: j.refresh_token || (S.token && S.token.refresh_token), expires_at: Date.now() + j.expires_in * 1000 };
  LS.set("bb_token", S.token);
}
async function refreshToken(){
  const body = new URLSearchParams({ grant_type: "refresh_token", refresh_token: S.token.refresh_token, client_id: S.clientId });
  const r = await fetch(TOKEN_URL, { method: "POST", headers: {"Content-Type":"application/x-www-form-urlencoded"}, body });
  if (!r.ok){ logout(); throw new Error("Session expirée, reconnecte-toi."); }
  setToken(await r.json());
}
function logout(){
  S.token = null; S.me = null; S.demo = false; S.guest = false; S.playlists = null;
  LS.del("bb_token"); LS.del("bb_me"); LS.del("bb_demo"); LS.del("bb_guest");
  S.view = "home"; render();
}
async function api(path, opts={}, retry=true){
  if (!S.token) throw new Error("Pas connecté.");
  if (Date.now() > S.token.expires_at - 60000) await refreshToken();
  const url = path.startsWith("http") ? path : API + path;
  const headers = { Authorization: "Bearer " + S.token.access_token };
  if (opts.body) headers["Content-Type"] = "application/json";
  const r = await fetch(url, { ...opts, headers });
  if (r.status === 401 && retry){ await refreshToken(); return api(path, opts, false); }
  if (!r.ok){
    let msg = ""; try{ const j = await r.json(); msg = (j.error && j.error.message) || j.reason || ""; }catch(e){}
    const e = new Error(
      r.status === 429 ? "Spotify limite les requêtes pour l'instant, réessaie dans un moment." :
      r.status === 403 ? "Accès refusé par Spotify (403). Vérifie que ton compte est ajouté dans « User Management » de ton app Spotify." :
      `Erreur Spotify ${r.status}${msg ? " : " + msg : ""}`);
    e.status = r.status; throw e;
  }
  if (r.status === 204) return null;
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}
async function apiAll(path, max=500){
  let url = path; const out = [];
  while (url && out.length < max){ const j = await api(url); out.push(...(j.items || [])); url = j.next; }
  return out.slice(0, max);
}

/* ========= Sources ========= */
async function run(msg, fn){
  setBusy(msg);
  try{ await fn(); }catch(e){ console.error(e); toast(e.message || String(e), 6000); }
  S.busy = null; render();
}
const loadTop = () => run("Récupération de tes tops…", async () => {
  const items = await apiAll(`/me/top/tracks?limit=50&time_range=${S.topRange}`, 100);
  addToPool(items.map(normTrack));
});
const loadLiked = () => run("Récupération de tes titres likés…", async () => {
  const items = await apiAll("/me/tracks?limit=50", 200);
  addToPool(items.map(i => normTrack(i.track || i.item)));
});
const openPlaylists = () => run("Chargement de tes playlists…", async () => {
  S.playlists = await apiAll("/me/playlists?limit=50", 300);
  S.view = "playlists";
});
const loadPlaylist = id => run("Récupération des sons de la playlist…", async () => {
  let items;
  try{ items = await apiAll(`/playlists/${id}/items?limit=50`, 500); }
  catch(e){
    if (e.status === 403 || e.status === 404) throw new Error("Spotify ne donne accès qu'au contenu de TES playlists (créées par toi).");
    throw e;
  }
  const tracks = items.map(i => normTrack(i.item || i.track)).filter(Boolean);
  if (!tracks.length){ toast("Aucun son récupéré : Spotify ne donne accès qu'au contenu de tes propres playlists.", 6000); return; }
  addToPool(tracks); S.view = "home";
});
const doSearch = (more=false) => run("Recherche…", async () => {
  if (!S.search.q.trim()) return;
  S.search.offset = more ? S.search.offset + 10 : 0;
  const j = await api(`/search?type=track&limit=10&offset=${S.search.offset}&q=${encodeURIComponent(S.search.q)}`);
  const res = ((j.tracks && j.tracks.items) || []).map(normTrack).filter(Boolean);
  S.search.results = more ? S.search.results.concat(res) : res;
});
function loadDemo(){
  const words = ["Midnight","Neon","Ocean","Fever","Gold","Ghost","Velvet","Thunder","Paradise","Mirage","Echo","Lights","Summer","Riot","Blue","Fire"];
  const arts = ["Nova K","Les Ombres","DJ Kaïto","Maya Sol","Rive Gauche","Lunar","Teddy B","Saphir"];
  const t = [];
  for (let i=1;i<=64;i++) t.push({ id:"demo"+i, demo:true, uri:"", name:`${words[i%16]} ${words[(i*7+3+Math.floor(i/16))%16]}`, artists:arts[i%8], arts:[{id:"da"+(i%8), name:arts[i%8]}], img:"" });
  addToPool(t);
}

/* ========= Bracket logic ========= */
function startBracket(){
  const n = S.size;
  let ids = S.pool.map(t => t.id);
  if (S.order === "random") shuffle(ids);
  ids = ids.slice(0, n);
  const tracks = {}; S.pool.forEach(t => { if (ids.includes(t.id)) tracks[t.id] = t; });
  const rounds = [ids]; for (let i=0;i<Math.log2(n);i++) rounds.push([]);
  S.bracket = { size: n, rounds, tracks }; S.savedUrl = null;
  saveBracket(); S.view = "duel"; render(); scrollTo(0,0);
}
function curRound(b){
  for (let k=0;k<b.rounds.length-1;k++) if (b.rounds[k+1].length < b.rounds[k].length/2) return k;
  return -1;
}
const isDone = b => b && curRound(b) === -1;
const picksDone = b => b.rounds.slice(1).reduce((s,r) => s + r.length, 0);
function pick(side){
  const b = S.bracket, k = curRound(b); if (k < 0) return;
  const m = b.rounds[k+1].length;
  b.rounds[k+1].push(b.rounds[k][2*m + side]);
  saveBracket();
  S.view = isDone(b) ? "results" : "duel";
  render(); scrollTo(0,0);
}
function undo(){
  const b = S.bracket;
  for (let k=b.rounds.length-1;k>=1;k--) if (b.rounds[k].length){ b.rounds[k].pop(); break; }
  S.savedUrl = null; saveBracket(); S.view = "duel"; render();
}
function ranking(b){
  const L = b.rounds.length - 1, out = [{ label:"1", ids:[b.rounds[L][0]] }];
  for (let k=L-1;k>=0;k--){
    const P = b.rounds[k].length, nxt = new Set(b.rounds[k+1]);
    out.push({ label: P === 2 ? "2" : `${P/2+1}–${P}`, ids: b.rounds[k].filter(id => !nxt.has(id)) });
  }
  return out;
}

const VS_SIZES = [3, 5, 7, 10];
const saveVsSetup = () => LS.set("bb_vs_setup", S.vs);
const saveVersus = () => S.versus ? LS.set("bb_versus", S.versus) : LS.del("bb_versus");
const searchCache = {};
function dedupeById(arr){ const s = new Set(), o = []; for (const t of arr){ if (t && !s.has(t.id)){ s.add(t.id); o.push(t); } } return o; }
function libTracks(){ return dedupeById(((S.lib && S.lib.tracks) || []).concat(S.pool)); }
function hasArtist(t, ar){
  if (t.arts && t.arts.length) return t.arts.some(a => a.id === ar.id);
  return (t.artists || "").toLowerCase().split(", ").includes(ar.name.toLowerCase());
}
const songKey = t => (t.name || "").toLowerCase().replace(/\s*[\(\[][^\)\]]*[\)\]]/g, "").replace(/\s+-\s+.*$/, "").trim();
function libArtists(){
  const m = new Map();
  for (const t of libTracks()) for (const a of (t.arts || [])){
    if (!a.id) continue; const e = m.get(a.id) || { id:a.id, name:a.name, count:0 }; e.count++; m.set(a.id, e);
  }
  return [...m.values()].sort((x, y) => y.count - x.count).slice(0, 18);
}
function avatar(a, cls="av"){
  return a && a.img ? `<img class="${cls}" src="${esc(a.img)}" alt="">` : `<div class="${cls}">${esc(((a && a.name) || "?").charAt(0).toUpperCase())}</div>`;
}
async function scanLibrary(){
  if (S.demo){ S.lib = { tracks:[], at:Date.now() }; return; }
  const out = [];
  setBusy("Scan : titres likés…");
  out.push(...(await apiAll("/me/tracks?limit=50", 500)).map(i => normTrack(i.track || i.item)));
  setBusy("Scan : tes tops…");
  for (const r of ["short_term","medium_term","long_term"])
    out.push(...(await apiAll(`/me/top/tracks?limit=50&time_range=${r}`, 100)).map(normTrack));
  setBusy("Scan : tes playlists…");
  const pls = S.playlists || await apiAll("/me/playlists?limit=50", 300); S.playlists = pls;
  const mine = pls.filter(p => !S.me || !p.owner || p.owner.id === S.me.id || p.collaborative).slice(0, 40);
  for (let i=0;i<mine.length;i++){
    setBusy(`Scan : playlist ${i+1}/${mine.length}…`);
    try{ out.push(...(await apiAll(`/playlists/${mine[i].id}/items?limit=50`, 300)).map(x => normTrack(x.item || x.track))); }
    catch(e){ if (e.status === 429) break; }
  }
  const hits = {}; out.forEach(t => { if (t) hits[t.id] = (hits[t.id] || 0) + 1; });
  const tracks = dedupeById(out.filter(Boolean)).map(t => ({ ...t, big:"", hits: hits[t.id] }));
  S.lib = { tracks, at: Date.now() }; LS.set("bb_lib", S.lib);
}
async function spotifyTracksOf(ar){
  if (S.demo || S.guest) return [];
  if (searchCache[ar.id]) return searchCache[ar.id];
  const out = [];
  for (let off=0; off<50; off+=10){
    const j = await api(`/search?type=track&limit=10&offset=${off}&q=${encodeURIComponent('artist:"' + ar.name + '"')}`);
    const items = (j.tracks && j.tracks.items) || [];
    out.push(...items.map(normTrack).filter(t => t && hasArtist(t, ar)));
    if (!j.tracks || !j.tracks.next || items.length < 10) break;
  }
  return (searchCache[ar.id] = out);
}
async function buildCandidates(ar){
  const mine = libTracks().filter(t => hasArtist(t, ar)).sort((x, y) => (y.hits || 0) - (x.hits || 0));
  const libIds = new Set(mine.map(t => t.id));
  let list;
  if (S.vs.src === "mine") list = mine;
  else { const sp = await spotifyTracksOf(ar); list = S.vs.src === "mix" ? mine.concat(sp) : sp.concat(mine); }
  const seen = new Set(), out = [];
  for (const t of list){ const k = songKey(t); if (!k || seen.has(k)) continue; seen.add(k); out.push({ ...t, mine: libIds.has(t.id) }); }
  return out.slice(0, 40);
}
async function rebuildBoth(){
  if (S.vs.a) S.vs.candA = await buildCandidates(S.vs.a);
  if (S.vs.b) S.vs.candB = await buildCandidates(S.vs.b);
  saveVsSetup();
}

  await scanLibrary(); await rebuildBoth();

});

  const q = S.artistPick.q.trim(); if (!q) return;
  if (S.guest){
    const lib = libArtists().filter(a => a.name.toLowerCase().includes(q.toLowerCase()));
    S.artistPick.results = lib.some(a => a.name.toLowerCase() === q.toLowerCase()) ? lib : [{ id:"g:" + q.toLowerCase(), name:q, img:"" }].concat(lib); return;
  }
  if (S.demo){ S.artistPick.results = libArtists().filter(a => a.name.toLowerCase().includes(q.toLowerCase())); return; }
  const j = await api(`/search?type=artist&limit=10&q=${encodeURIComponent(q)}`);
  S.artistPick.results = ((j.artists && j.artists.items) || []).map(a => ({ id:a.id, name:a.name, img: ((a.images || [])[1] || (a.images || [])[0] || {}).url || "" }));

  const side = S.artistPick.side, other = side === 0 ? S.vs.b : S.vs.a;
  if (other && other.id === ar.id){ toast("Choisis deux artistes différents 😉"); return; }
  if (!S.lib && !S.demo && !S.guest) await scanLibrary();
  if (!ar.img && !S.demo && !S.guest){
    try{ const f = await api(`/artists/${ar.id}`); ar.img = ((f.images || [])[1] || (f.images || [])[0] || {}).url || ""; }catch(e){}
  }
  setBusy("Récupération des sons de " + ar.name + "…");
  const cand = await buildCandidates(ar);
  if (side === 0){ S.vs.a = ar; S.vs.candA = cand; } else { S.vs.b = ar; S.vs.candB = cand; }
  S.vsOpen[side] = false; saveVsSetup(); S.view = "home";
  if (cand.length < 3) toast(`Seulement ${cand.length} son(s) trouvé(s) pour ${ar.name}. Essaie une autre source.`, 6000);
});
const curVs = v => v.rounds.findIndex(r => r.w === null);
const vsScore = v => [v.rounds.filter(r => r.w === 0).length, v.rounds.filter(r => r.w === 1).length];
function startVersus(random){
  const n = Math.min(S.vs.n, S.vs.candA.length, S.vs.candB.length);
  let A = S.vs.candA.slice(), B = S.vs.candB.slice();
  if (random || S.vs.order === "random"){ A = shuffle(A.slice(0, n*3)); B = shuffle(B.slice(0, n*3)); }
  A = A.slice(0, n); B = B.slice(0, n);
  S.versus = { a:S.vs.a, b:S.vs.b, rounds: A.map((t, i) => ({ a:t, b:B[i], w:null })), savedUrl:null };
  saveVersus(); S.view = "vsDuel"; render(); scrollTo(0,0);
}
function vsVote(s){

function vsUndo(){
  const v = S.versus;
  for (let i=v.rounds.length-1;i>=0;i--) if (v.rounds[i].w !== null){ v.rounds[i].w = null; break; }
  v.savedUrl = null; saveVersus(); S.view = "vsDuel"; render();

      const a = b.rounds[k][2*m], c = b.rounds[k][2*m+1];
      const nm = id => id ? esc(b.tracks[id].name) : "…";
      const isCur = k === cur && m === b.rounds[k+1].length;
      ms.push(`<div class="mt ${isCur?"cur":""}"><div class="${a&&nxt.has(a)?"w":""}">${nm(a)}</div><div class="${c&&nxt.has(c)?"w":""}">${nm(c)}</div></div>`);
    }
    cols.push(`<div class="col"><h4>${ROUND_NAMES[full] || full}</h4>${ms.join("")}</div>`);
  }
  const L = b.rounds.length - 1, champ = b.rounds[L][0];
  cols.push(`<div class="col"><h4>Vainqueur</h4><div class="mt"><div class="${champ?"w":""}">${champ ? "🏆 " + esc(b.tracks[champ].name) : "…"}</div></div></div>`);
  return `<div class="modal"><div class="mh"><b>Bracket (${b.size} sons)</b><button class="btn sm" data-act="hideBracket">Fermer</button></div>
    <div class="bwrap"><div class="cols">${cols.join("")}</div></div></div>`;
}

/* ========= Liens & import (sans connexion) ========= */
const IMG = h => !h ? "" : h.startsWith("http") ? h : "https://i.scdn.co/image/" + h;
async function tracksFromLinks(text, ar){
  const ids = [...new Set([...String(text).matchAll(/track[\/:]([A-Za-z0-9]{22})/g)].map(m => m[1]))];
  const out = [];
  for (const id of ids){
    let name = "Son Spotify", img = "";
    try{
      const r = await fetch("https://open.spotify.com/oembed?url=" + encodeURIComponent("https://open.spotify.com/track/" + id));
      if (r.ok){ const j = await r.json(); name = j.title || name; img = j.thumbnail_url || ""; }
    }catch(e){}
    out.push({ id, uri:"spotify:track:" + id, name, img, artists: ar ? ar.name : "", arts: ar ? [{ id:ar.id, name:ar.name }] : [], mine:true });
  }
  return out;
}
const pastePool = () => { const el = document.getElementById("pasteP"), txt = el ? el.value : ""; return run("Ajout des sons…", async () => {
  const t = await tracksFromLinks(txt);
  if (!t.length){ toast("Aucun lien de son Spotify trouvé. Dans Spotify : ⋯ → Partager → Copier le lien du titre."); return; }
  addToPool(t);
}); };
const vsPaste = side => { const el = document.getElementById("paste" + side), txt = el ? el.value : ""; return run("Ajout des sons…", async () => {
  const ar = side === 0 ? S.vs.a : S.vs.b;
  const t = await tracksFromLinks(txt, ar);
  if (!t.length){ toast("Aucun lien de son Spotify trouvé."); return; }
  const list = side === 0 ? S.vs.candA : S.vs.candB, have = new Set(list.map(x => x.id));
  t.forEach(x => { if (!have.has(x.id)) list.push(x); });
  saveVsSetup(); toast(`+${t.length} son(s) pour ${ar.name}`);
}); };
function b64urlDecode(str){
  let x = str.replace(/-/g, "+").replace(/_/g, "/"); while (x.length % 4) x += "=";
  return new TextDecoder().decode(Uint8Array.from(atob(x), c => c.charCodeAt(0)));
}
function importCode(code){
  const raw = String(code).trim().replace(/^.*#import=/, "").replace(/\s+/g, "");
  let d; try{ d = JSON.parse(b64urlDecode(raw)); }catch(e){ toast("Code invalide 😕 Vérifie qu'il est copié en entier."); return false; }
  if (!S.token && !S.demo){ S.guest = true; LS.set("bb_guest", true); }
  if (d.t === "vs"){
    const mk = x => ({ id: x.id || ("g:" + x.n.toLowerCase()), name: x.n, img: IMG(x.i) });
    const a = mk(d.a), b = mk(d.b);
    const tr = (arr, ar) => arr.map(([id, name, img, feat]) => ({ id, uri:"spotify:track:" + id, name, img: IMG(img),
      artists: ar.name + (feat ? ", " + feat : ""), arts: [{ id:ar.id, name:ar.name }], mine:true }));
    if (S.versus && curVs(S.versus) !== -1){ S.versus = null; saveVersus(); }
    S.vs.a = a; S.vs.b = b; S.vs.candA = tr(d.A, a); S.vs.candB = tr(d.B, b);
    if (d.n) S.vs.n = d.n; S.vs.order = "ordered"; saveVsSetup();
    S.mode = "versus"; toast(`Versus importé : ${a.name} vs ${b.name} 🥊`);
  } else if (d.t === "pool"){
    addToPool(d.P.map(([id, name, artists, img]) => ({ id, uri:"spotify:track:" + id, name, artists: artists || "", img: IMG(img) })));
    S.mode = "bracket";
  } else { toast("Code non reconnu."); return false; }
  LS.set("bb_mode", S.mode); S.view = "home"; return true;
}
function vImport(){
  return `<div class="top"><button class="btn sm ghost" data-act="home">← Retour</button><b>Importer un code</b><span></span></div>
  <p class="small mut">Colle ici le code (ou le lien) que Claude t'a donné : il remplit automatiquement ton versus ou ton bracket.</p>
  <textarea id="impCode" rows="6" placeholder="eyJ2Ijox…"></textarea>
  <div style="height:10px"></div><button class="btn pri full" data-act="doImport">Importer</button>`;
}

/* ========= Versus views ========= */
function vVsSetup(){
  const v = S.versus, live = v && curVs(v) !== -1;
  let resume = "";
  if (v){
    const [sa, sb] = vsScore(v);
    resume = live ? `<div class="card resume"><b>Versus en cours</b> <span class="mut small">· ${esc(v.a.name)} ${sa} – ${sb} ${esc(v.b.name)}</span>
        <div class="grid2" style="margin-top:10px"><button class="btn vio" data-act="vsResume">Reprendre</button>
        <button class="btn danger" data-act="vsAbandon">Abandonner</button></div></div>`
      : `<div class="card"><b>Dernier versus :</b> ${esc(v.a.name)} ${sa} – ${sb} ${esc(v.b.name)}
        <div style="margin-top:10px"><button class="btn sm" data-act="vsResults">Voir les résultats</button></div></div>`;
  }
  const rapper = side => {
    const ar = side === 0 ? S.vs.a : S.vs.b, cand = side === 0 ? S.vs.candA : S.vs.candB, cls = side === 0 ? "a" : "b";
    if (!ar) return `<div class="card"><span class="tag ${cls}">Rappeur ${side+1}</span><div style="height:10px"></div>
      <button class="btn full ${side===0?"pri":"vio"}" data-act="vsPickArtist" data-s="${side}">+ Choisir un rappeur</button></div>`;
    const nMine = cand.filter(t => t.mine).length;
    const list = S.vsOpen[side] ? `<div class="poolList" style="margin-top:6px">${cand.map((t, i) => `
        <div class="row">${cover(t)}<div class="meta"><div class="t">${i+1}. ${esc(t.name)}${t.mine ? ' <span class="mine">❤️</span>' : ""}</div><div class="a">${esc(t.artists)}</div></div>
        <button class="x" data-act="vsRm" data-s="${side}" data-i="${i}" aria-label="Retirer">✕</button></div>`).join("") || `<p class="mut small">Aucun son.</p>`}</div>` : "";
    return `<div class="card"><div class="row" style="border:0;padding:0">${avatar(ar)}
        <div class="meta"><span class="tag ${cls}">Rappeur ${side+1}</span><div class="t" style="font-size:18px;margin-top:4px">${esc(ar.name)}</div>
        <div class="a">${cand.length} sons en lice${nMine ? ` · ${nMine} ❤️ à toi` : ""}</div></div>
        <button class="btn sm ghost" data-act="vsPickArtist" data-s="${side}">Changer</button></div>
      ${S.guest ? `<textarea id="paste${side}" rows="2" style="margin-top:10px" placeholder="Colle des liens de sons de ${esc(ar.name)}…"></textarea>
        <button class="btn sm ${side===0?"pri":"vio"} full" style="margin-top:6px" data-act="vsPaste" data-s="${side}">+ Ajouter ces sons</button>` : ""}
      <button class="btn sm ghost full" style="margin-top:10px" data-act="vsToggle" data-s="${side}">${S.vsOpen[side] ? "Masquer les sons ▴" : "Voir / retirer des sons ▾"}</button>${list}</div>`;
  };
  const maxN = Math.min(S.vs.candA.length, S.vs.candB.length);
  const ready = S.vs.a && S.vs.b && maxN >= 1;
  const n = Math.min(S.vs.n, maxN);
  const libInfo = S.demo ? (S.pool.length ? "" : `<button class="btn full" data-act="demoAdd">+ Ajouter les sons de démo</button>`)
    : S.guest ? `<p class="small mut">Mode sans connexion : choisis un rappeur puis colle les liens de ses sons, ou <a href="#" data-act="import">importe un code</a>.</p>`
    : `<p class="small mut">${S.lib ? `Ta bibliothèque : ${S.lib.tracks.length} sons scannés (likés, tops, tes playlists) · <a href="#" data-act="scan">Rescanner</a>`
        : `Ta bibliothèque n'est pas encore scannée. <a href="#" data-act="scan">Scanner maintenant</a>`}</p>`;
  return header() + resume + `
  <p class="mut small" style="margin-top:0">Deux rappeurs, leurs sons s'affrontent un par un. Celui qui gagne le plus de rounds l'emporte.</p>
  ${libInfo}
  ${rapper(0)}<div class="vs" style="text-align:center">VS</div>${rapper(1)}
  ${S.demo || S.guest ? "" : `<h2>Quels sons ?</h2>
  <div class="chips">
    <button class="chip ${S.vs.src==="mix"?"on":""}" data-act="vsSrc" data-v="mix" ${S.demo?"disabled":""}>❤️ Mes sons d'abord</button>
    <button class="chip ${S.vs.src==="mine"?"on":""}" data-act="vsSrc" data-v="mine">❤️ Que mes sons</button>
    <button class="chip ${S.vs.src==="spotify"?"on":""}" data-act="vsSrc" data-v="spotify" ${S.demo?"disabled":""}>🌍 Catalogue Spotify</button>
  </div>
  <p class="small mut">« Mes sons » = ceux de tes titres likés, tes tops et tes playlists. Le catalogue complète avec les autres sons de l'artiste.</p>`}
  <h2>Nombre de rounds</h2>
  <div class="chips">${VS_SIZES.map(s => `<button class="chip ${s===S.vs.n?"on":""}" data-act="vsN" data-n="${s}">${s}</button>`).join("")}</div>
  <div style="height:10px"></div>
  <div class="chips"><button class="chip ${S.vs.order==="ordered"?"on":""}" data-act="vsOrder" data-o="ordered">📋 Meilleurs d'abord (n°1 vs n°1…)</button>
    <button class="chip ${S.vs.order==="random"?"on":""}" data-act="vsOrder" data-o="random">🎲 Tirage aléatoire</button></div>
  <div style="height:16px"></div>
  <button class="btn pri full" data-act="vsStart" ${ready ? "" : "disabled"}>${ready ? `Lancer le versus (${n} round${n>1?"s":""})` : "Choisis deux rappeurs"}</button>
  ${ready && n < S.vs.n ? `<p class="small mut" style="text-align:center">Pas assez de sons pour ${S.vs.n} rounds, on part sur ${n}.</p>` : ""}
  <div style="height:30px"></div>`;
}
function vVsPick(){
  const P = S.artistPick, libA = libArtists();
  const res = P.results.length ? `<div class="card">${P.results.map((a, i) => `
      <div class="row">${avatar(a, "av")}<div class="meta"><div class="t">${esc(a.name)}</div></div>
      <button class="btn sm pri" data-act="vsChoose" data-src="res" data-i="${i}">Choisir</button></div>`).join("")}</div>` : "";
  const lib = libA.length ? `<h2>Dans ta bibliothèque</h2><div class="chips">${libA.map((a, i) =>
      `<button class="chip" data-act="vsChoose" data-src="lib" data-i="${i}">${esc(a.name)} <span class="mut">${a.count}</span></button>`).join("")}</div>`
    : (S.demo ? `<p class="mut small">Ajoute d'abord les sons de démo.</p>` : `<p class="mut small">Scanne ta bibliothèque pour voir ici les rappeurs que tu écoutes le plus.
       <br><br><button class="btn sm" data-act="scan">Scanner ma bibliothèque</button></p>`);
  return `<div class="top"><button class="btn sm ghost" data-act="home">← Retour</button><b>Rappeur ${P.side+1}</b><span></span></div>
  <form id="af" style="display:flex;gap:8px"><input type="text" id="aq" placeholder="${S.guest ? "Écris le nom du rappeur" : "Nom du rappeur…"}" value="${esc(P.q)}" autocomplete="off">
  <button class="btn pri" type="submit">OK</button></form>${res}${lib}<div style="height:30px"></div>`;
}
function vVsDuel(){
  const v = S.versus, i = curVs(v);
  if (i < 0){ S.view = "vsResults"; return vVsResults(); }
  const r = v.rounds[i], [sa, sb] = vsScore(v);
  const side = (t, s, ar) => `<div class="side ${s===0?"a":"b"}">
      <span class="tag ${s===0?"a":"b"}">${esc(ar.name)}</span>
      <div class="head">${cover(t)}<div style="min-width:0"><div class="t">${esc(t.name)}</div><div class="a">${esc(t.artists)}</div></div></div>
      ${embed(t)}
      <button class="btn ${s===0?"pri":"vio"} full" data-act="vsVote" data-s="${s}">Je garde celui-là</button></div>`;
  return `<div class="top"><button class="btn sm ghost" data-act="home">← Accueil</button><span class="small mut">Round ${i+1} / ${v.rounds.length}</span></div>
    <div class="score"><div class="p">${avatar(v.a)}<div class="n">${esc(v.a.name)}</div></div>
      <div class="s">${sa} – ${sb}</div><div class="p">${avatar(v.b)}<div class="n">${esc(v.b.name)}</div></div></div>
    <div class="bar"><i style="width:${Math.round(i / v.rounds.length * 100)}%"></i></div>
    <div class="duel">${side(r.a, 0, v.a)}<div class="vs">VS</div>${side(r.b, 1, v.b)}</div>
    <div class="actions">${i ? `<button class="btn sm ghost" data-act="vsUndo">↶ Annuler le dernier choix</button>` : ""}</div>`;
}
function vVsResults(){
  const v = S.versus; if (!v || curVs(v) !== -1){ S.view = "home"; return vVsSetup(); }
  const [sa, sb] = vsScore(v), W = sa > sb ? v.a : sb > sa ? v.b : null;
  const top = W ? `<div class="mut small" style="letter-spacing:2px">🏆 VAINQUEUR</div>${avatar(W, "av big")}<div class="t">${esc(W.name)}</div>`
    : `<div class="mut small" style="letter-spacing:2px">🤝 ÉGALITÉ</div><div style="display:flex;justify-content:center;gap:8px">${avatar(v.a, "av big")}${avatar(v.b, "av big")}</div>`;
  return `<div class="top"><button class="btn sm ghost" data-act="home">← Accueil</button><span></span></div>
  <div class="win">${top}<div style="font-size:30px;font-weight:900;margin-top:6px">${sa} – ${sb}</div>
    <div class="mut small">${esc(v.a.name)} vs ${esc(v.b.name)}</div></div>
  <div class="actions">
    ${S.demo || S.guest ? "" : v.savedUrl ? `<a class="btn pri" href="${esc(v.savedUrl)}" target="_blank" rel="noopener">Ouvrir la playlist ↗</a>`
      : `<button class="btn pri" data-act="vsSave">💾 Playlist des gagnants</button>`}
    <button class="btn" data-act="vsShare">Partager</button></div>
  <h2>Détail des rounds</h2>
  <div class="card"><div class="rd" style="padding-top:0"><div></div><div><span class="tag a">${esc(v.a.name)}</span></div><div><span class="tag b">${esc(v.b.name)}</span></div></div>
  ${v.rounds.map((r, i) => `<div class="rd"><div class="n">R${i+1}</div>
     <div class="${r.w===0?"w":"l"}">${r.w===0?"✅ ":""}${esc(r.a.name)}</div><div class="${r.w===1?"w":"l"}">${r.w===1?"✅ ":""}${esc(r.b.name)}</div></div>`).join("")}</div>
  <div class="actions"><button class="btn ghost" data-act="vsUndo">↶ Annuler le dernier choix</button>
    <button class="btn" data-act="vsRematch">🔁 Revanche (nouveau tirage)</button>
    <button class="btn vio" data-act="vsNew">Nouveau versus</button></div><div style="height:30px"></div>`;
}

function render(){
  let html;
  if (S.view === "import") html = vImport();
  else if (!S.demo && !S.guest && !S.clientId) html = vSetup();
  else if (!S.demo && !S.guest && !S.token) html = S.view === "setup" ? vSetup() : vLogin();
  else {
    const home = S.mode === "versus" ? vVsSetup : vHome;
    html = ({ home, playlists:vPlaylists, search:vSearch, duel:vDuel, results:vResults, setup:vSetup,
              vsPick:vVsPick, vsDuel:vVsDuel, vsResults:vVsResults }[S.view] || home)();
  }
  if (S.showBracket && S.bracket) html += vBracketModal();
  if (S.busy) html += `<div class="busy"><div class="spin"></div><div>${esc(S.busy)}</div></div>`;
  $app.innerHTML = html;
  const sf = document.getElementById("sf");
  if (sf) sf.onsubmit = e => { e.preventDefault(); S.search.q = document.getElementById("q").value; doSearch(false); };
  const af = document.getElementById("af");
  if (af) af.onsubmit = e => { e.preventDefault(); S.artistPick.q = document.getElementById("aq").value; searchArtists(); };
  const rg = document.getElementById("range");
  if (rg) rg.onchange = e => { S.topRange = e.target.value; };
}

/* ========= Events ========= */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (el.tagName === "A") e.preventDefault();
  switch (act){
    case "copyRU": try{ await navigator.clipboard.writeText(REDIRECT_URI); toast("Copié !"); }catch(_){ toast("Copie impossible, sélectionne le texte à la main."); } break;
    case "saveCid": {
      const v = document.getElementById("cid").value.trim();
      if (!/^[a-zA-Z0-9]{20,40}$/.test(v)){ toast("Ce Client ID n'a pas l'air valide (32 caractères en général)."); break; }
      S.clientId = v; LS.set("bb_client_id", v); S.view = "home"; render(); break; }
    case "editCid": S.view = "setup"; render(); break;
    case "login": login(); break;
    case "logout": logout(); break;
    case "demo": S.demo = true; LS.set("bb_demo", true); S.view = "home"; render(); break;
    case "demoAdd": loadDemo(); render(); break;
    case "home": S.view = "home"; render(); scrollTo(0,0); break;
    case "playlists": openPlaylists(); break;
    case "addPl": loadPlaylist(el.dataset.id); break;
    case "top": loadTop(); break;
    case "liked": loadLiked(); break;
    case "search": S.view = "search"; render(); setTimeout(() => { const q = document.getElementById("q"); if (q) q.focus(); }, 50); break;
    case "more": doSearch(true); break;
    case "addRes": addToPool([S.search.results[+el.dataset.i]]); render(); break;
    case "rm": S.pool.splice(+el.dataset.i, 1); savePool(); render(); break;
    case "shufflePool": shuffle(S.pool); savePool(); render(); break;
    case "clear": if (confirm("Vider tout le pool ?")){ S.pool = []; savePool(); render(); } break;
    case "size": S.size = +el.dataset.s; LS.set("bb_size", S.size); render(); break;
    case "order": S.order = el.dataset.o; LS.set("bb_order", S.order); render(); break;
    case "start": {
      const valid = SIZES.filter(s => s <= S.pool.length);
      if (!valid.includes(S.size)) S.size = valid[valid.length-1];
      if (S.bracket && !isDone(S.bracket) && !confirm("Un bracket est en cours. Le remplacer ?")) break;
      startBracket(); break; }
    case "resume": S.view = "duel"; render(); break;
    case "abandon": if (confirm("Abandonner le bracket en cours ?")){ S.bracket = null; saveBracket(); render(); } break;
    case "results": S.view = "results"; render(); break;
    case "pick": pick(+el.dataset.s); break;
    case "undo": undo(); break;
    case "showBracket": S.showBracket = true; render(); break;
    case "hideBracket": S.showBracket = false; render(); break;
    case "savePl": saveAsPlaylist(); break;
    case "share": share(); break;
    case "guest": S.guest = true; LS.set("bb_guest", true); S.view = "home"; render(); break;
    case "import": S.view = "import"; render(); break;
    case "doImport": { const v = (document.getElementById("impCode") || {}).value || ""; if (importCode(v)){ render(); scrollTo(0,0); } break; }
    case "pastePool": pastePool(); break;
    case "vsPaste": vsPaste(+el.dataset.s); break;
    case "mode": S.mode = el.dataset.m; LS.set("bb_mode", S.mode); S.view = "home"; render(); break;
    case "scan": doScan(); break;
    case "vsPickArtist": S.artistPick = { side:+el.dataset.s, q:"", results:[] }; S.view = "vsPick"; render();
      setTimeout(() => { const q = document.getElementById("aq"); if (q) q.focus(); }, 50); break;
    case "vsChoose": {
      const a = el.dataset.src === "res" ? S.artistPick.results[+el.dataset.i] : libArtists()[+el.dataset.i];
      if (a) chooseArtist({ id:a.id, name:a.name, img:a.img || "" }); break; }
    case "vsRm": (el.dataset.s === "0" ? S.vs.candA : S.vs.candB).splice(+el.dataset.i, 1); saveVsSetup(); render(); break;
    case "vsToggle": S.vsOpen[el.dataset.s] = !S.vsOpen[el.dataset.s]; render(); break;
    case "vsSrc": S.vs.src = el.dataset.v; saveVsSetup(); run("Mise à jour des sons…", rebuildBoth); break;
    case "vsN": S.vs.n = +el.dataset.n; saveVsSetup(); render(); break;
    case "vsOrder": S.vs.order = el.dataset.o; saveVsSetup(); render(); break;
    case "vsStart":
      if (S.versus && curVs(S.versus) !== -1 && !confirm("Un versus est en cours. Le remplacer ?")) break;
      startVersus(false); break;
    case "vsResume": S.view = "vsDuel"; render(); break;
    case "vsAbandon": if (confirm("Abandonner le versus en cours ?")){ S.versus = null; saveVersus(); render(); } break;
    case "vsResults": S.view = "vsResults"; render(); break;
    case "vsVote": vsVote(+el.dataset.s); break;
    case "vsUndo": vsUndo(); break;
    case "vsSave": saveVsPlaylist(); break;
    case "vsShare": vsShare(); break;
    case "vsRematch": startVersus(true); break;
    case "vsNew": S.versus = null; saveVersus(); S.vs.a = S.vs.b = null; S.vs.candA = []; S.vs.candB = []; saveVsSetup();
      S.view = "home"; render(); scrollTo(0,0); break;
    case "newBracket": S.bracket = null; S.savedUrl = null; saveBracket(); S.view = "home"; render(); scrollTo(0,0); break;
  }
});

/* ========= Boot ========= */
(async function boot(){
  if (location.hash.startsWith("#import=")){
    const h = location.hash; history.replaceState(null, "", location.pathname + location.search);
    importCode(h);
  }
  const q = new URLSearchParams(location.search);
  if (q.has("code") || q.has("error")){
    S.busy = "Connexion à Spotify…"; render();
    try{ await handleCallback(q); }catch(e){ toast("Connexion impossible : " + e.message, 6000); }
    S.busy = null;
  }
  if (S.token && !S.demo){
    try{ S.me = await api("/me"); LS.set("bb_me", S.me); }
    catch(e){ toast(e.message, 6000); }
  }
  if (S.bracket && isDone(S.bracket) && S.view === "home") S.view = "home";
  render();
})();
</script>
</body>
</html>
